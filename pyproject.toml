[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-deepagent"
version = "0.1.0"
description = "Terminal-first engineering assistant — motor design with Deep Agents"
readme = "README.md"
requires-python = ">=3.13"

license = { text = "MIT" }

dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "deepagents>=0.6.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0,<2.0.0",
    "langchain-core>=0.3.0",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "langgraph-cli[inmem]>=0.1.0",
 ]

rag = [
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
]

motorcad = [
    "ansys.motorcad.core",
    "numpy>=2.0",
]

[project.scripts]
motor = "apps.cli.main:main"

[tool.setuptools.packages.find]
include = ["src*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]