[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-deepagent"
version = "0.1.0"
description = "Terminal-first engineering assistant — repo/wiki/research/motor-design"
readme = "README.md"
requires-python = ">=3.13"

license = { text = "MIT" }

dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Phase 2 dependencies (install when research subgraph is activated)
research = [
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
]

# Phase 4 dependencies (install when motor-domain tools are activated)
motorcad = [
    "ansys.motorcad.core",
    "numpy>=2.0",
]

[tool.setuptools.packages.find]
include = ["src*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
